<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080b10"/>
      <stop offset=".58" stop-color="#10151d"/>
      <stop offset="1" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#07090d" stop-opacity=".98"/>
      <stop offset=".42" stop-color="#080b10" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#080b10" stop-opacity=".36"/>
      <stop offset="1" stop-color="#080b10" stop-opacity=".18"/>
    </linearGradient>
    <linearGradient id="titanium" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#29323d"/>
      <stop offset=".26" stop-color="#121820"/>
      <stop offset=".67" stop-color="#202832"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#82909d" stop-opacity=".26"/>
      <stop offset=".45" stop-color="#394551" stop-opacity=".1"/>
      <stop offset="1" stop-color="#080b10" stop-opacity=".58"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00e5ff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="haze" cx="0" cy="0" r="1" gradientTransform="matrix(0 490 -740 0 1518 520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a8795" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0a0e14" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#a9bac7" stroke-opacity=".035"/>
    </pattern>
    <pattern id="vents" width="12" height="10" patternUnits="userSpaceOnUse">
      <path d="M1 5h8" stroke="#a2b0bc" stroke-opacity=".18" stroke-width="1.4"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <g id="serverShelf">
      <rect width="148" height="92" rx="3" fill="#090d12" stroke="#56616d" stroke-opacity=".45"/>
      <path d="M1 1h146v18H1z" fill="#1a222b"/>
      <path d="M12 31h83v4H12zm0 11h104v4H12zm0 11h70v4H12z" fill="url(#vents)"/>
      <path d="M12 72h72" stroke="#71808c" stroke-opacity=".23"/>
      <circle cx="126" cy="32" r="2.4" fill="#61dbe0" fill-opacity=".72"/>
      <circle cx="126" cy="43" r="2.4" fill="#6dffb3" fill-opacity=".48"/>
      <circle cx="126" cy="54" r="2.4" fill="#ff2c9c" fill-opacity=".38"/>
    </g>
  </defs>

  <path fill="url(#room)" d="M0 0h1920v1080H0z"/>
  <path fill="url(#haze)" d="M750 0h1170v1080H750z"/>
  <path fill="url(#microGrid)" opacity=".52" d="M0 0h1920v1080H0z"/>

  <!-- Recessed command-bay wall, with machined alloy panels and rack hardware. -->
  <path d="M1028 68h892v847l-57 92h-827l-37-66z" fill="#06090e" fill-opacity=".82" stroke="#71808c" stroke-opacity=".28" stroke-width="2"/>
  <path d="M1060 92h860v801l-48 75h-794l-31-56z" fill="url(#titanium)" stroke="#8996a2" stroke-opacity=".32" stroke-width="2"/>
  <path d="M1060 92h860v801l-48 75h-794l-31-56z" fill="url(#edge)"/>

  <!-- Outer frame rails and recessed service channels. -->
  <path d="M1092 126h42v757h-42zm757 0h37v746h-37z" fill="#080c11" stroke="#85919d" stroke-opacity=".2"/>
  <path d="M1104 151v690m769-690v683" stroke="#91a0ac" stroke-opacity=".17" stroke-width="2"/>
  <path d="M1094 186h23m-23 4h23m-23 4h23M1858 186h22m-22 4h22m-22 4h22" stroke="#9ba7b2" stroke-opacity=".24"/>

  <!-- Three quiet server bays, set behind the foreground console card. -->
  <g opacity=".86">
    <rect x="1168" y="156" width="202" height="650" rx="5" fill="#080c11" stroke="#71808d" stroke-opacity=".42" stroke-width="2"/>
    <rect x="1180" y="168" width="178" height="626" fill="#0c1117" stroke="#34404b"/>
    <use href="#serverShelf" x="1195" y="192"/>
    <use href="#serverShelf" x="1195" y="296"/>
    <use href="#serverShelf" x="1195" y="400"/>
    <use href="#serverShelf" x="1195" y="504"/>
    <use href="#serverShelf" x="1195" y="608"/>
    <use href="#serverShelf" x="1195" y="712"/>

    <rect x="1393" y="133" width="202" height="675" rx="5" fill="#080c11" stroke="#71808d" stroke-opacity=".5" stroke-width="2"/>
    <rect x="1405" y="145" width="178" height="651" fill="#0b1016" stroke="#34404b"/>
    <use href="#serverShelf" x="1420" y="168"/>
    <use href="#serverShelf" x="1420" y="272"/>
    <use href="#serverShelf" x="1420" y="376"/>
    <use href="#serverShelf" x="1420" y="480"/>
    <use href="#serverShelf" x="1420" y="584"/>
    <use href="#serverShelf" x="1420" y="688"/>

    <rect x="1618" y="166" width="202" height="640" rx="5" fill="#080c11" stroke="#71808d" stroke-opacity=".42" stroke-width="2"/>
    <rect x="1630" y="178" width="178" height="616" fill="#0b1016" stroke="#34404b"/>
    <use href="#serverShelf" x="1645" y="200"/>
    <use href="#serverShelf" x="1645" y="304"/>
    <use href="#serverShelf" x="1645" y="408"/>
    <use href="#serverShelf" x="1645" y="512"/>
    <use href="#serverShelf" x="1645" y="616"/>
    <use href="#serverShelf" x="1645" y="720"/>
  </g>

  <!-- Titanium cross braces, recessed floor, and low-key status illumination. -->
  <path d="M1144 116h690M1144 842h690" stroke="#8b98a4" stroke-opacity=".25" stroke-width="2"/>
  <path d="M1058 890h833l-44 61h-750z" fill="#070a0f" stroke="#66737f" stroke-opacity=".35"/>
  <path d="M1095 915h720" stroke="url(#cyanGlow)" stroke-width="2"/>
  <path d="M1174 966h628m-589 18h554m-507 18h460" stroke="#84909b" stroke-opacity=".12"/>
  <path d="M1860 220v436" stroke="#00e5ff" stroke-opacity=".28" stroke-width="2"/>
  <path d="M1860 220v436" stroke="#00e5ff" stroke-opacity=".22" stroke-width="8" filter="url(#soft)"/>

  <!-- Quiet silhouette vignette preserves contrast behind all copy. -->
  <path fill="url(#fade)" d="M0 0h1920v1080H0z"/>
</svg>
